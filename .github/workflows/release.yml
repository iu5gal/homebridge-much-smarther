# Publishes a version when its tag (vX.Y.Z) is pushed: a GitHub release with
# the CHANGELOG.md section as notes and the package tarball, and, once the
# repository variable NPM_PUBLISH is "true", the npm package with provenance
# through npm trusted publishing (no npm token is stored). npm stays off until
# the package is set up for trusted publishing on npmjs.com.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm ci
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./packages/homebridge-plugin/package.json').version")
          test "v${VERSION}" = "${TAG}" || { echo "tag ${TAG} but package version ${VERSION}"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit
      - run: node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
      - run: npm run pack:plugin
      - if: vars.NPM_PUBLISH == 'true'
        run: npm publish "pack/homebridge-much-smarther-${VERSION}.tgz" --provenance --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "pack/homebridge-much-smarther-${VERSION}.tgz" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
