version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The tests use Homebridge, which carries its own hap-nodejs: the two must match.
      homebridge:
        patterns:
          - homebridge
          - '@homebridge/hap-nodejs'
    ignore:
      # The type definitions follow the oldest supported Node.js, not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Major TypeScript versions wait until typescript-eslint supports them; updated by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
