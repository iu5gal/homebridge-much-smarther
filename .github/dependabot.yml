version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The tests need the same hap-nodejs as Homebridge: it is updated by hand,
      # together with Homebridge, to the version Homebridge depends on.
      - dependency-name: '@homebridge/hap-nodejs'
      # The type definitions follow the oldest supported Node.js, not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Major TypeScript versions wait until typescript-eslint supports them; updated by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
