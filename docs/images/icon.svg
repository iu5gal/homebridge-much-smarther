<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Plugin icon: the setup page's dial, set to a temperature, around a heated home. -->
  <!-- Rendered to icon.png (100×100) with: rsvg-convert -w 100 -h 100 icon.svg -o icon.png -->
  <defs>
    <radialGradient id="background" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#40301f"/>
      <stop offset="1" stop-color="#161312"/>
    </radialGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e9692c"/>
      <stop offset="1" stop-color="#f7a046"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0.9" stdDeviation="1.3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#background)"/>
  <!-- Dial: a 270° track, centre (50, 51.5), radius 32; the value reaches 72 % of it. -->
  <path d="M27.37 74.13A32 32 0 1 1 72.63 74.13" fill="none" stroke="#fff" stroke-opacity="0.13" stroke-width="9" stroke-linecap="round"/>
  <path d="M27.37 74.13A32 32 0 1 1 77.54 35.21" fill="none" stroke="url(#heat)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="77.54" cy="35.21" r="7.2" fill="#f5efe6" stroke="#f0883e" stroke-width="2.6" filter="url(#shadow)"/>
  <!-- Home -->
  <path d="M34.5 53.5 50 40l15.5 13.5V65a3 3 0 0 1-3 3h-25a3 3 0 0 1-3-3z" fill="none" stroke="#f5efe6" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Flame: the setup page's flame icon, filled -->
  <g transform="translate(41.5 50) scale(0.708)">
    <path d="M12 21.5a6.5 6.5 0 0 0 6.5-6.5c0-3.6-2.4-5.8-3.9-7.9-.9-1.3-1.4-2.7-1.5-4.6-2.6 1.6-4.4 4.2-4.6 7.1-.8-.6-1.3-1.5-1.5-2.6-1.4 1.6-1.5 5.3-1.5 8A6.5 6.5 0 0 0 12 21.5z" fill="#f0883e"/>
    <path d="M12 21.5a3 3 0 0 1-3-3c0-1.8 1.4-2.9 3-4.9 1.6 2 3 3.1 3 4.9a3 3 0 0 1-3 3z" fill="#f5efe6"/>
  </g>
</svg>
